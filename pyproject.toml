[project]
name = "flowledger"
version = "0.1.0"
description = "CDC PostgreSQL: согласованный снимок, WAL и восстанавливаемая проекция"
requires-python = ">=3.11"
dependencies = ["psycopg[binary]>=3.2,<4", "psycopg2-binary>=2.9.10,<3", "pika>=1.3,<2"]
[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]
[tool.ruff]
line-length = 100
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
