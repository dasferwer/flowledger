name: Проверки
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SOURCE_URL: postgresql://demo:demo@localhost:54839/source
      TARGET_URL: postgresql://demo:demo@localhost:54939/projection
      FLOWLEDGER_FAULTS: "1"
      AMQP_URL: amqp://demo:demo@localhost:5639/%2F
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.17"
          python-version: "3.11"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: docker compose up --build -d
      - run: uv run pytest -q
      - run: uv run python -m scripts.recovery
      - run: uv run python -m scripts.fault_recovery
      - if: always()
        run: docker compose logs --tail 30 publisher projector && docker compose down
